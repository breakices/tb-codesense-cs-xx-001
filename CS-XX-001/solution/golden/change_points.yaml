    why: "分项加起来必须等于合计。先把未舍入的行金额加总再舍入一次，两行各 0.036 会得到 0.07，而页面上两行各显示 0.04。整改前单价是两位小数，这个等式天然成立，精度一改就破了。"
    required: true
