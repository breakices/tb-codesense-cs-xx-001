    answer_section: "answer.md 第 2 节 CP1"
    change: "单件税额的保留位数由两位改为四位。"
    why: "按两位保留时 0.01 x 20% = 0.002 被舍成 0.00，税额在单件层面就丢失了；含税单价也因此带着舍入误差被数量放大。"
