    lines: [289]
    answer_section: "answer.md 第 2 节 CP2"
    change: "quantize 显式使用 ROUND_HALF_UP。"
    why: "quantize 不传 rounding 时用的是当前 decimal 上下文的舍入方式，默认 ROUND_HALF_EVEN。0.03 x 17.5% = 0.00525 会得到 0.0052。"
    required: true
    unit_tests: [U7]
