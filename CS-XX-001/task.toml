[metadata.expert_design_notes]
intent = "题面说明两个症状、顾客可见的金额口径及历史记录兼容规则。草稿覆盖症状所在的两处，照做以后症状消失。要拿到分，模型必须自己发现哪些环节依赖这批金额，并判断自己的改法会不会破坏它们。隐藏单测里有 23 条在未改动的快照上本来就通过，其中 10 条会被草稿的改法破坏。"
trap_design = "陷阱分两类。第一类是草稿里三个可判定的错误说法：quantize 不带 rounding 时是银行家舍入；在合计处统一舍入是先加总再舍入，分项加不回合计；下游不会自然变对。第二类是修症状带来的连锁后果：订单的价格明细按分保存单价，分批发货的结算按明细逐件累加，单价变成四位小数后各批之和不再等于订单行金额；购物车行直接比较四位小数的现价和两位小数的记录价，价格没变也提示变动；DecimalField 落库和 Babel 展示各自按银行家舍入量化，与合计不一致；搜索索引直接取四位小数的单价，价格筛选和排序用的数不再是页面上显示的价格，这一处与购物车和订单没有调用关系。这些后果在上游项目的真实修复里同样存在，反例程序可以复现。上线前已有的订单是另一层：如果改的是结算逻辑而不是明细，必须保证已结算了一部分的旧订单仍按原明细结清。"
boundary = "不纳入断言的行为：（1）商品促销的折扣算法及其在各行上用精确值还是取整值；（2）进位点上先保不含税金额还是先保税额；（3）多行时合计与各行如何取得一致，逐行舍入或把差额分摊到行上都接受；（4）分批结算每一批的具体金额，每批为非负分位金额，累计不超订单行应收，最后结清；历史订单依据原有明细结算；（5）多件商品如何分组及分摊余数，由实现决定；明细数量、税前和含税金额须与订单行对账；（6）折扣记录与各行折扣之和的一分钱差异；（7）辅助计算的表示方式；定价策略对外返回的单件税额和含税单价明确受四位精度要求约束；（8）自定义金额格式与零小数位币种的展示；（9）是否新增辅助函数、命名、迁移；（10）仓库自带测试是否通过。"
challenge_discrimination = "草稿区分两类行为。一类模型把草稿当作范围，照做两处或在两处附近小修：症状类单测通过，但原来通过的 10 条被破坏，另有 10 条原有失败仍未解决。另一类模型把题面的两条底线当作范围，沿着金额的去向逐个环节核对，并回头检查自己的改动对已有数据的影响。其中“quantize 默认四舍五入”区分是否核对语言语义（U7、U8、U13、U14），“在合计处统一舍入”区分是否理解分项与合计的关系（U15 到 U19），“下游自然就对”区分是否追踪到结算、价格提示、落库、展示和搜索索引（U22 到 U24、U27、U9、U10、U12、U39 到 U41）。"

